# このファイルを論文リポジトリの .github/workflows/review.yml としてコピーして使用してください。

name: Overleaf Review

on:
  workflow_dispatch:
    inputs:
      review_stage:
        description: 'レビューの段階 — structure: 構成・ロジック / proofread: 表現・誤字脱字 / final: 最終チェック（全部）'
        required: true
        type: choice
        options:
          - structure
          - proofread
          - final
        default: structure
      review_mode:
        description: 'レビュー範囲 — diff_only: 前回のレビューとの差分 / full_review: 全体'
        required: true
        type: choice
        options:
          - diff_only
          - full_review
        default: diff_only
      runner:
        description: '実行環境 — self-hosted: セルフホストランナー / ubuntu-latest: GitHubホストランナー'
        required: true
        type: choice
        options:
          - self-hosted
          - ubuntu-latest
        default: self-hosted

jobs:
  review:
    uses: tdufi-idl/OverleafReviewer/.github/workflows/sync.yaml@main
    with:
      review_stage: ${{ inputs.review_stage }}
      review_mode: ${{ inputs.review_mode }}
      runner: ${{ inputs.runner }}
    secrets: inherit
